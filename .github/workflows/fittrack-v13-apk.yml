name: FitTrack v13 APK Bootstrap
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fittrack-v13-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary FitTrack branch
        uses: actions/checkout@v4
        with:
          ref: fittrack-apk-build
          fetch-depth: 0

      - name: Record workflow run id immediately
        shell: bash
        run: |
          echo "$GITHUB_RUN_ID" > fittrack-build/run-id-v13.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fittrack-build/run-id-v13.txt
          git commit -m "Record FitTrack v13 build run" || true
          git push origin HEAD:fittrack-apk-build

      - name: Reconstruct FitTrack source
        shell: bash
        run: |
          cat fittrack-build/chunk_* | base64 -d > /tmp/FitTrack-v13-source.zip
          mkdir -p fittrack-src
          unzip -q /tmp/FitTrack-v13-source.zip -d fittrack-src
          test -f fittrack-src/settings.gradle.kts
          test -f fittrack-src/server/index.mjs

      - name: Validate FitTrack server
        working-directory: fittrack-src
        run: node --check server/index.mjs

      - name: Install Android API 36
        shell: bash
        run: yes | sdkmanager "platforms;android-36" >/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: fittrack-src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v13-debug
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
