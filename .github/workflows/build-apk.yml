name: Build Monitoring center Mobile v19

on:
  push:
    branches:
      - mc-apk-build-20260918

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare sources
        run: |
          unzip -q MonitoringCenterMobile_android_source.zip
          cp patch/MainActivity.java MonitoringCenterMobile/app/src/main/java/com/monitoringcenter/mobile/MainActivity.java
          cp patch/MonitorService.java MonitoringCenterMobile/app/src/main/java/com/monitoringcenter/mobile/MonitorService.java
          cp patch/QrScanActivity.java MonitoringCenterMobile/app/src/main/java/com/monitoringcenter/mobile/QrScanActivity.java
          cp patch/AndroidManifest.xml MonitoringCenterMobile/app/src/main/AndroidManifest.xml
          cp patch/app-build.gradle MonitoringCenterMobile/app/build.gradle
      - name: Build
        working-directory: MonitoringCenterMobile
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Monitoring-center-Mobile-v19
          path: MonitoringCenterMobile/app/build/outputs/apk/debug/app-debug.apk
