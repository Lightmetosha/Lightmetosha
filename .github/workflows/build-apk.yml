name: Build Monitoring center APK

on:
  push:
    branches:
      - mc-apk-build-20260918

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          unzip -q MonitoringCenterMobile_android_source.zip
          ls -la MonitoringCenterMobile

      - name: Build debug APK
        working-directory: MonitoringCenterMobile
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Monitoring-center-Mobile
          path: MonitoringCenterMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
