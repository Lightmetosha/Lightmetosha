name: Build FitTrack v17 APK
# retry after payload verification
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fittrack-v17-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v17 payload
        uses: actions/checkout@v4
        with:
          ref: fittrack-v17-build
          fetch-depth: 0

      - name: Record run id
        shell: bash
        run: |
          echo "$GITHUB_RUN_ID" > fittrack-v17-payload/run-id-v17.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fittrack-v17-payload/run-id-v17.txt
          git commit -m "Record FitTrack v17 build run" || true
          git push origin HEAD:fittrack-v17-build

      - name: Reconstruct FitTrack v17 source
        shell: bash
        run: |
          cat fittrack-v17-payload/chunk_* | base64 -d > /tmp/FitTrack-v17-source.zip
          mkdir -p fittrack-src
          unzip -t /tmp/FitTrack-v17-source.zip
          unzip -q /tmp/FitTrack-v17-source.zip -d fittrack-src
          test -f fittrack-src/settings.gradle.kts
          test -f fittrack-src/app/build.gradle.kts

      - name: Install Android API 36
        shell: bash
        run: yes | sdkmanager "platforms;android-36" >/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: fittrack-src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v17-debug
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
