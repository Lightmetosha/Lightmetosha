name: FitTrack v14 APK Build
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fittrack-v14-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v13 source chunks
        uses: actions/checkout@v4
        with:
          ref: fittrack-apk-build
          fetch-depth: 0

      - name: Record run id
        shell: bash
        run: |
          echo "$GITHUB_RUN_ID" > fittrack-build/run-id-v14.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fittrack-build/run-id-v14.txt
          git commit -m "Record FitTrack v14 build run" || true
          git push origin HEAD:fittrack-apk-build

      - name: Reconstruct v13 source
        shell: bash
        run: |
          cat fittrack-build/chunk_* | base64 -d > /tmp/FitTrack-v13-source.zip
          mkdir -p fittrack-src
          unzip -q /tmp/FitTrack-v13-source.zip -d fittrack-src
          test -f fittrack-src/settings.gradle.kts

      - name: Apply v14 fixes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/data/CloudApi.kt
          echo '' | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/ProfileBackupUi.kt
          echo '' | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/data/FoodCatalogApi.kt
          echo '' | base64 -d | gzip -d > fittrack-src/app/build.gradle.kts
          echo '' | base64 -d | gzip -d > /tmp/patch_main_v14.py
          python3 /tmp/patch_main_v14.py
          echo '' | base64 -d | gzip -d > fittrack-src/README-v14.md
          grep -q 'versionCode = 14' fittrack-src/app/build.gradle.kts
          grep -q 'fun localSearch' fittrack-src/app/src/main/java/com/lightme/fittrack/data/FoodCatalogApi.kt
          grep -q 'Никаких URL' fittrack-src/app/src/main/java/com/lightme/fittrack/ProfileBackupUi.kt

      - name: Install Android API 36
        shell: bash
        run: yes | sdkmanager "platforms;android-36" >/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: fittrack-src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v14-debug
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
