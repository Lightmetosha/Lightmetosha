name: FitTrack APK Bootstrap
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fittrack-apk-bootstrap.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary FitTrack branch
        uses: actions/checkout@v4
        with:
          ref: fittrack-apk-build
          fetch-depth: 0

      - name: Record workflow run id immediately
        shell: bash
        run: |
          echo "$GITHUB_RUN_ID" > fittrack-build/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fittrack-build/run-id.txt
          git commit -m "Record FitTrack APK build run" || true
          git push origin HEAD:fittrack-apk-build

      - name: Reconstruct FitTrack source
        shell: bash
        run: |
          cat fittrack-build/chunk_* | base64 -d > /tmp/FitTrack-v12-source.zip
          mkdir -p fittrack-src
          unzip -q /tmp/FitTrack-v12-source.zip -d fittrack-src
          test -f fittrack-src/settings.gradle.kts

      - name: Patch FitTrack compile issues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("fittrack-src/app/src/main/java/com/lightme/fittrack/MainActivity.kt")
          s=p.read_text()
          s=s.replace("import androidx.health.connect.client.permission.PermissionController", "import androidx.health.connect.client.PermissionController")
          s=s.replace("import com.google.android.gms.mlkit.barcode.GmsBarcodeScanning", "import com.google.mlkit.vision.codescanner.GmsBarcodeScanning")
          s=s.replace("import com.google.android.gms.mlkit.barcode.GmsBarcodeScannerOptions", "import com.google.mlkit.vision.codescanner.GmsBarcodeScannerOptions")
          old='''@Composable fun WeightChart(data:List<WeightEntry>,modifier:Modifier){Canvas(modifier){if(data.size<2)return@Canvas;val vals=data.map{it.kg};val lo=vals.min();val hi=vals.max();val range=max(hi-lo,1.0);val dx=size.width/(data.size-1);for(i in 0 until data.size-1){fun y(v:Double)=size.height-(((v-lo)/range)*size.height*.8+size.height*.1).toFloat();drawLine(Color(0xFF8B6CFF),Offset(i*dx,y(vals[i])),Offset((i+1)*dx,y(vals[i+1])),5f)}}}'''
          new='''@Composable
          fun WeightChart(data: List<WeightEntry>, modifier: Modifier) {
              Canvas(modifier) {
                  if (data.size < 2) return@Canvas
                  val vals = data.map { it.kg }
                  val lo = vals.minOrNull() ?: return@Canvas
                  val hi = vals.maxOrNull() ?: return@Canvas
                  val range = max(hi - lo, 1.0)
                  val dx = size.width / (data.size - 1)
                  fun chartY(v: Double): Float =
                      size.height - (((v - lo) / range) * size.height * .8 + size.height * .1).toFloat()
                  for (i in 0 until data.size - 1) {
                      drawLine(
                          Color(0xFF8B6CFF),
                          Offset(i * dx, chartY(vals[i])),
                          Offset((i + 1) * dx, chartY(vals[i + 1])),
                          5f
                      )
                  }
              }
          }'''
          s=s.replace(old,new)
          s=s.replace("@Composable fun ActiveWorkoutScreen", "@OptIn(ExperimentalMaterial3Api::class)\n@Composable fun ActiveWorkoutScreen")
          p.write_text(s)

          t=Path("fittrack-src/app/src/main/java/com/lightme/fittrack/ui/theme/Theme.kt")
          ts=t.read_text().replace(
              "@Composable fun FitTheme(content:@Composable()->Unit){ MaterialTheme(colorScheme=Dark, typography=Typography(), content=content) }",
              "@Composable\nfun FitTheme(content: @Composable () -> Unit) {\n    MaterialTheme(colorScheme = Dark, typography = Typography(), content = content)\n}"
          )
          t.write_text(ts)
          PY

      - name: Upgrade Android build toolchain for Health Connect
        shell: bash
        run: |
          sed -i 's/version "8.7.3"/version "8.9.1"/g' fittrack-src/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/g' fittrack-src/app/build.gradle.kts
          sed -i '/compileSdk = 36/a\    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' fittrack-src/app/build.gradle.kts
          yes | sdkmanager "platforms;android-36" >/dev/null || true

      - name: Enable AndroidX
        shell: bash
        run: |
          cat > fittrack-src/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: fittrack-src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
