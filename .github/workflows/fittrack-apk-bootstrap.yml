name: FitTrack APK Bootstrap
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fittrack-apk-bootstrap.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary FitTrack branch
        uses: actions/checkout@v4
        with:
          ref: fittrack-apk-build
          fetch-depth: 0

      - name: Record workflow run id immediately
        shell: bash
        run: |
          echo "$GITHUB_RUN_ID" > fittrack-build/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fittrack-build/run-id.txt
          git commit -m "Record FitTrack APK build run" || true
          git push origin HEAD:fittrack-apk-build

      - name: Reconstruct FitTrack source
        shell: bash
        run: |
          cat fittrack-build/chunk_* | base64 -d > /tmp/FitTrack-v12-source.zip
          mkdir -p fittrack-src
          unzip -q /tmp/FitTrack-v12-source.zip -d fittrack-src
          test -f fittrack-src/settings.gradle.kts

      - name: Upgrade Android build toolchain for Health Connect
        shell: bash
        run: |
          sed -i 's/version "8.7.3"/version "8.9.1"/g' fittrack-src/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/g' fittrack-src/app/build.gradle.kts
          yes | sdkmanager "platforms;android-36" >/dev/null || true

      - name: Enable AndroidX
        shell: bash
        run: |
          cat > fittrack-src/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: fittrack-src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
