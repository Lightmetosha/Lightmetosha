name: Build FitTrack v18 APK
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fittrack-v18-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v17 base
        uses: actions/checkout@v4
        with:
          ref: fittrack-v17-build
          fetch-depth: 0

      - name: Record run id
        shell: bash
        run: |
          git fetch origin fittrack-v18-build:refs/remotes/origin/fittrack-v18-build
          git worktree add /tmp/fittrack-v18 refs/remotes/origin/fittrack-v18-build
          cd /tmp/fittrack-v18
          echo "$GITHUB_RUN_ID" > fittrack-v18-fixes/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fittrack-v18-fixes/run-id.txt
          git commit -m "Record FitTrack v18 build run" || true
          git push origin HEAD:fittrack-v18-build

      - name: Reconstruct v17 source
        shell: bash
        run: |
          cat fittrack-v17-payload/chunk_00 fittrack-v17-payload/chunk_01 fittrack-v17-payload/chunk_02 fittrack-v17-payload/chunk_03 fittrack-v17-payload/chunk_04 fittrack-v17-payload/chunk_05 fittrack-v17-payload/chunk_06 fittrack-v17-payload/chunk_06b fittrack-v17-payload/chunk_07 fittrack-v17-payload/chunk_08 | base64 -d > /tmp/FitTrack-v17-source.zip
          mkdir -p fittrack-src
          unzip -q /tmp/FitTrack-v17-source.zip -d fittrack-src

      - name: Apply v17 compile fixes
        shell: bash
        run: |
          cat fittrack-v17-fixes/main_*.b64 | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/MainActivity.kt
          cat fittrack-v17-fixes/sources_*.b64 | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/HealthSourcesUi.kt
          cat fittrack-v17-fixes/workout_*.b64 | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/ProfessionalWorkoutUi.kt

      - name: Apply v18 fixes
        shell: bash
        run: |
          git fetch origin fittrack-v18-build:refs/remotes/origin/fittrack-v18-build
          {
            git show origin/fittrack-v18-build:fittrack-v18-fixes/MainActivity.kt.b64.00
            git show origin/fittrack-v18-build:fittrack-v18-fixes/MainActivity.kt.b64.01
            git show origin/fittrack-v18-build:fittrack-v18-fixes/MainActivity.kt.b64.02
          } | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/MainActivity.kt
          git show origin/fittrack-v18-build:fittrack-v18-fixes/HealthSourcesUi.kt.b64.00 | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/HealthSourcesUi.kt
          git show origin/fittrack-v18-build:fittrack-v18-fixes/HealthStepsManager.kt.b64.00 | base64 -d | gzip -d > fittrack-src/app/src/main/java/com/lightme/fittrack/HealthStepsManager.kt
          git show origin/fittrack-v18-build:fittrack-v18-fixes/AndroidManifest.xml.b64.00 | base64 -d | gzip -d > fittrack-src/app/src/main/AndroidManifest.xml
          git show origin/fittrack-v18-build:fittrack-v18-fixes/build.gradle.kts.b64.00 | base64 -d | gzip -d > fittrack-src/app/build.gradle.kts
          grep -q 'versionCode = 18' fittrack-src/app/build.gradle.kts
          grep -q 'Внести вес сегодня' fittrack-src/app/src/main/java/com/lightme/fittrack/MainActivity.kt
          grep -q 'HMS Core' fittrack-src/app/src/main/java/com/lightme/fittrack/HealthSourcesUi.kt

      - name: Install Android API 36
        shell: bash
        run: yes | sdkmanager "platforms;android-36" >/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: fittrack-src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v18-debug
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
