name: Build MTProto helpers

on:
  push:
    branches:
      - mc-mtproto-helper-20261007
  workflow_dispatch:

jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - name: Download gotd tg helpers
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/windows out/linux /tmp/win /tmp/linux
          curl -L --fail --retry 3 -o /tmp/tg-win.tar.gz https://github.com/gotd/cli/releases/download/v0.11.0/tg_0.11.0_windows_amd64.tar.gz
          curl -L --fail --retry 3 -o /tmp/tg-linux.tar.gz https://github.com/gotd/cli/releases/download/v0.11.0/tg_0.11.0_linux_amd64.tar.gz
          tar -xzf /tmp/tg-win.tar.gz -C /tmp/win
          tar -xzf /tmp/tg-linux.tar.gz -C /tmp/linux
          find /tmp/win -maxdepth 3 -type f -print
          find /tmp/linux -maxdepth 3 -type f -print
          WIN_BIN="$(find /tmp/win -type f -name 'tg.exe' | head -1)"
          LIN_BIN="$(find /tmp/linux -type f -name 'tg' | head -1)"
          test -n "$WIN_BIN"
          test -n "$LIN_BIN"
          cp "$WIN_BIN" out/windows/tg.exe
          cp "$LIN_BIN" out/linux/tg
          chmod +x out/linux/tg
          sha256sum out/windows/tg.exe out/linux/tg > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-center-mtproto-helpers
          path: out
          if-no-files-found: error
